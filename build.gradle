    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            showStandardStreams = true
        }
    }
}

// The platform artifacts are self-contained mod jars: core + platform + ClassGraph.
// ClassGraph is intentionally NOT relocated - see RESEARCH.md section 6.4.
subprojects { sub ->
    if (sub.name == 'polymixin-core') return

    sub.configurations {
        bundled
        compileOnly.extendsFrom bundled
    }

    sub.tasks.named('jar', Jar) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest {
            attributes(
                'Specification-Title': 'polymixin',
                'Specification-Version': sub.version,
                'Implementation-Title': sub.name,
                'Implementation-Version': sub.version
            )
        }
        dependsOn sub.configurations.bundled
        from({
            sub.configurations.bundled.collect { it.isDirectory() ? it : sub.zipTree(it) }
        }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**', 'module-info.class'
        }
    }

    sub.tasks.named('processResources', ProcessResources) {
        inputs.property 'version', sub.version
        filesMatching('fabric.mod.json') {
            expand version: sub.version
        }
    }
}
